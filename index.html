<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patrimônio OCR - Gestão por Setor</title>
  <link rel="stylesheet" href="estilo/style.css">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="app-header">
    <h1>Leitor de Patrimônio por Setor</h1>
    <p>Envie imagens, extraia números e gere planilhas com salvamento automático.</p>
  </header>

  <main class="container">
    <section class="card profile-card">
      <h2>Dados do usuário</h2>
      <div class="grid two-cols">
        <label>Usuário
          <input id="userName" type="text" placeholder="Ex.: William">
        </label>
        <label>Unidade
          <input id="userUnit" type="text" placeholder="Ex.: Cascavel">
        </label>
      </div>
      <div class="actions">
        <button id="saveProfileBtn" class="btn primary">Salvar dados</button>
        <button id="loadProfileBtn" class="btn">Carregar dados salvos</button>
      </div>
    </section>

    <section class="card">
      <div class="tabs-top">
        <h2>Abas de setores</h2>
        <div class="actions">
          <button id="addTabBtn" class="btn primary">+ Adicionar aba</button>
        </div>
      </div>

      <div id="tabs" class="tabs"></div>
      <div id="tabPanel" class="tab-panel"></div>

      <div class="actions bottom-actions">
        <button id="saveCurrentBtn" class="btn">Salvar planilha atual</button>
        <button id="downloadCurrentBtn" class="btn primary">Baixar planilha atual</button>
        <button id="downloadAllBtn" class="btn">Baixar todas as planilhas</button>
      </div>
    </section>

    <section class="card">
      <h2>Log</h2>
      <ul id="log" class="log"></ul>
    </section>
  </main>
</body>
</html>
